<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editora Anglo - Chat IA</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <style>
        :root {
            --bg-purple: #392048;
            --text-beige: #FFCE9B;
            --text-white: #FFFFFF;
            --text-dark: #2C2C2C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Playfair Display', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 60px 45px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(57, 32, 72, 0.25);
            text-align: center;
            max-width: 500px;
            border: 2px solid rgba(255, 206, 155, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% {
                text-shadow: 0 0 20px rgba(255, 206, 155, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(255, 206, 155, 0.6);
            }
            100% {
                text-shadow: 0 0 20px rgba(255, 206, 155, 0.3);
            }
        }

        .logo-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            width: 100px;
            height: auto;
            transition: transform 0.3s ease;
        }

        .logo-container img:hover {
            transform: scale(1.08) translateY(-5px);
        }

        h1 {
            color: var(--bg-purple);
            margin-bottom: 12px;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .tagline {
            color: var(--text-beige);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .subtitle {
            color: rgba(57, 32, 72, 0.75);
            margin-bottom: 35px;
            font-size: 18px;
            line-height: 1.7;
            font-weight: 400;
        }

        .subtitle strong {
            color: var(--bg-purple);
            font-weight: 700;
        }

        .cta-button {
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: var(--text-beige);
            padding: 18px 50px;
            border: none;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(57, 32, 72, 0.3);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .cta-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(57, 32, 72, 0.4);
            background: linear-gradient(135deg, #4a2f5a 0%, #392048 100%);
        }

        .cta-button:active {
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
            }

            .cta-button {
                padding: 16px 40px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="/img/logo.png" alt="Editora Anglo">
        </div>

        <div class="tagline">Editora Anglo</div>

        <h1>Iris</h1>
        
        <p class="subtitle">
            Converse com nossa inteligência artificial sobre <strong>Margens Invisíveis</strong> e a Editora Anglo
        </p>

        <a href="/api/chat?page=chat" class="cta-button">
            Iniciar Conversa
        </a>
    </div>
</body>
</html>
