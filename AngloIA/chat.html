<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA - Editora Anglo</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-purple: #392048;
            --text-beige: #FFCE9B;
            --text-white: #FFFFFF;
            --text-dark: #2C2C2C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Playfair Display', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #392048 0%, #4a2f5a 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(57, 32, 72, 0.25);
            overflow: hidden;
            height: 80vh;
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(255, 206, 155, 0.1);
        }
        
        .chat-header {
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: white;
            padding: 30px 25px;
            text-align: center;
            border-bottom: 3px solid var(--text-beige);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .chat-header-logo {
            width: 50px;
            height: auto;
            opacity: 0.95;
            transition: transform 0.3s ease;
        }
        
        .chat-header:hover .chat-header-logo {
            transform: scale(1.05);
        }
        
        .chat-header h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 600;
            color: var(--text-beige);
            letter-spacing: 0.5px;
        }
        
        .chat-header p {
            opacity: 0.9;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin: 0;
            font-weight: 300;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(to bottom, #fafafa 0%, #f5f5f5 100%);
            scroll-behavior: smooth;
        }
        
        .message {
            margin-bottom: 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message-content {
            padding: 15px 20px;
            border-radius: 16px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.6;
            box-shadow: 0 3px 12px rgba(57, 32, 72, 0.12);
            transition: all 0.3s ease;
        }
        
        .message-content:hover {
            box-shadow: 0 4px 16px rgba(57, 32, 72, 0.15);
        }
        
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4,
        .message-content h5,
        .message-content h6 {
            margin: 12px 0 8px 0;
            font-weight: 600;
            color: var(--bg-purple);
        }
        
        .message-content h1 { font-size: 1.5em; }
        .message-content h2 { font-size: 1.3em; }
        .message-content h3 { font-size: 1.1em; }
        
        .message-content p {
            margin: 8px 0;
        }
        
        .message-content ul,
        .message-content ol {
            margin: 10px 0 10px 20px;
        }
        
        .message-content li {
            margin: 5px 0;
        }
        
        .message-content code {
            background: rgba(57, 32, 72, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--bg-purple);
        }
        
        .message-content pre {
            background: rgba(57, 32, 72, 0.08);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 0.9em;
            border-left: 3px solid var(--text-beige);
        }
        
        .message-content blockquote {
            border-left: 4px solid var(--text-beige);
            padding-left: 12px;
            margin: 10px 0;
            opacity: 0.85;
            font-style: italic;
        }
        
        .message-content strong {
            font-weight: 600;
            color: var(--bg-purple);
        }
        
        .message-content em {
            font-style: italic;
        }
        
        .message-content a {
            color: var(--bg-purple);
            text-decoration: underline;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }
        
        .message-content a:hover {
            opacity: 1;
        }
        
        .user-message .message-content code {
            background: rgba(255, 206, 155, 0.3);
            color: inherit;
        }
        
        .user-message .message-content pre {
            background: rgba(255, 206, 155, 0.2);
            border-left-color: rgba(255, 255, 255, 0.5);
        }
        
        .bot-message .message-content a {
            color: var(--bg-purple);
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .user-message .message-content {
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: white;
            margin-left: auto;
            box-shadow: 0 3px 12px rgba(57, 32, 72, 0.25);
        }
        
        .bot-message .message-content {
            background: white;
            border: 1px solid rgba(255, 206, 155, 0.2);
            color: var(--text-dark);
        }
        
        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        
        .message-avatar:hover {
            transform: scale(1.1);
        }
        
        .bot-avatar {
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: var(--text-beige);
            box-shadow: 0 3px 12px rgba(57, 32, 72, 0.2);
        }
        
        .user-avatar {
            background: linear-gradient(135deg, var(--text-beige) 0%, #e7cfa7 100%);
            color: var(--bg-purple);
            box-shadow: 0 3px 12px rgba(255, 206, 155, 0.3);
        }
        
        .typing {
            display: none;
            padding: 15px 20px;
            color: var(--bg-purple);
            font-style: italic;
            text-align: center;
            background: rgba(255, 206, 155, 0.1);
            border-radius: 10px;
            margin: 10px 20px;
            font-size: 0.9em;
        }
        
        .chat-input {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 2px solid rgba(255, 206, 155, 0.2);
            gap: 12px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid rgba(57, 32, 72, 0.1);
            border-radius: 24px;
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
            color: var(--text-dark);
        }
        
        .chat-input input::placeholder {
            color: rgba(57, 32, 72, 0.5);
        }
        
        .chat-input input:focus {
            border-color: var(--text-beige);
            background: rgba(255, 206, 155, 0.05);
            box-shadow: 0 0 0 3px rgba(255, 206, 155, 0.1);
        }
        
        .chat-input button {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: var(--text-beige);
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(57, 32, 72, 0.2);
        }
        
        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(57, 32, 72, 0.3);
        }
        
        .chat-input button:active {
            transform: translateY(0);
        }
        
        .chat-input button:disabled {
            background: rgba(57, 32, 72, 0.3);
            cursor: not-allowed;
            transform: none;
            color: rgba(255, 206, 155, 0.5);
        }
        
        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(57, 32, 72, 0.9);
            color: var(--text-beige);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 12px;
            display: none;
            border: 1px solid var(--text-beige);
        }
        
        .admin-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(57, 32, 72, 0.15);
            padding: 15px;
            z-index: 1000;
            border: 2px solid var(--text-beige);
        }
        
        .admin-panel-toggle {
            background: var(--bg-purple);
            color: var(--text-beige);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            width: 100%;
        }
        
        .admin-panel-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(57, 32, 72, 0.2);
        }
        
        .admin-content {
            display: none;
            min-width: 280px;
        }
        
        .admin-content.active {
            display: block;
        }
        
        .admin-section {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(57, 32, 72, 0.1);
        }
        
        .admin-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .admin-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--bg-purple);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        
        .admin-textarea {
            width: 100%;
            min-height: 60px;
            padding: 8px;
            border: 1px solid rgba(57, 32, 72, 0.2);
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            resize: vertical;
        }
        
        .admin-button {
            background: var(--text-beige);
            color: var(--bg-purple);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 6px;
        }
        
        .admin-button:hover {
            background: var(--bg-purple);
            color: var(--text-beige);
            transform: translateY(-1px);
        }
        
        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--text-beige);
            color: var(--bg-purple);
            border: none;
            padding: 12px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(255, 206, 155, 0.3);
            z-index: 999;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(255, 206, 155, 0.4);
        }
        
        .suggestion-btn {
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: var(--text-beige);
            border: 1px solid var(--text-beige);
            padding: 8px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .suggestion-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(57, 32, 72, 0.2);
            background: linear-gradient(135deg, #4a2f5a 0%, var(--bg-purple) 100%);
        }
        
        .suggestion-btn:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(57, 32, 72, 0.15);
        }
        
        .suggestions-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .chat-container {
                height: 90vh;
                border-radius: 12px;
            }
            
            .chat-header {
                padding: 20px;
            }
            
            .chat-header h1 {
                font-size: 20px;
            }
            
            .message-content {
                max-width: 85%;
                padding: 12px 16px;
            }
            
            .chat-input {
                padding: 15px;
            }
            
            .chat-input input {
                font-size: 14px;
                padding: 12px 16px;
            }
            
            .chat-input button {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="/img/logo.png" alt="Editora Anglo" class="chat-header-logo">
            <h1>IA Editora Anglo</h1>
            <p>Assistente inteligente da editora</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-avatar bot-avatar"></div>
                <div class="message-content">
                    <strong>Olá!</strong> Sou a IA da Editora Anglo. Como posso ajudar?
                </div>
            </div>
        </div>
        
        <div class="typing" id="typing">
            Editora Anglo está digitando...
        </div>
        
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Digite sua mensagem..." maxlength="500">
            <button onclick="sendMessage()" id="sendButton">Enviar</button>
        </div>
    </div>
    
    <div class="stats" id="stats"></div>
    
    <!-- Admin Panel -->
    <div class="admin-panel">
        <button class="admin-panel-toggle" id="adminToggle">⚙️ Painel Admin</button>
        <div class="admin-content" id="adminContent">
            <div class="admin-section">
                <label class="admin-label">Base de Dados do Sistema</label>
                <textarea class="admin-textarea" id="sysPrompt" placeholder="System prompt da IA..."></textarea>
                <button class="admin-button" onclick="saveSystemPrompt()">Salvar</button>
            </div>
            
            <div class="admin-section">
                <label class="admin-label">Adicionar Contexto</label>
                <textarea class="admin-textarea" id="contextData" placeholder="Dados/contexto adicionais..."></textarea>
                <button class="admin-button" onclick="saveContextData()">Salvar</button>
            </div>
            
            <div class="admin-section">
                <label class="admin-label">Testes Rápidos</label>
                <button class="admin-button" style="background: #27ae60; color: white;" onclick="testPrompt('Quem é a Editora Anglo?')">Teste 1</button>
                <button class="admin-button" style="background: #27ae60; color: white;" onclick="testPrompt('Fale sobre Margens Invisíveis')">Teste 2</button>
                <button class="admin-button" style="background: #27ae60; color: white;" onclick="testPrompt('Qual o valor do livro?')">Teste 3</button>
            </div>
            
            <div class="admin-section">
                <button class="admin-button" style="background: #e74c3c; color: white;" onclick="limparChat()">Limpar Chat</button>
            </div>
        </div>
    </div>
    
    <!-- Botão Voltar -->
    <button class="back-button" onclick="window.location.href='/'">← Voltar</button>

    <script>
        // Admin Panel Toggle
        document.getElementById('adminToggle').addEventListener('click', function() {
            const content = document.getElementById('adminContent');
            content.classList.toggle('active');
        });
        
        // Load saved data on page load
        window.addEventListener('load', function() {
            const savedSysPrompt = localStorage.getItem('sysPrompt');
            const savedContext = localStorage.getItem('contextData');
            if (savedSysPrompt) document.getElementById('sysPrompt').value = savedSysPrompt;
            if (savedContext) document.getElementById('contextData').value = savedContext;
        });
        
        function saveSystemPrompt() {
            const prompt = document.getElementById('sysPrompt').value;
            localStorage.setItem('sysPrompt', prompt);
            alert('System prompt salvo!');
        }
        
        function saveContextData() {
            const context = document.getElementById('contextData').value;
            localStorage.setItem('contextData', context);
            alert('Contexto salvo!');
        }
        
        function testPrompt(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }
        
        function limparChat() {
            if (confirm('Tem certeza que deseja limpar todo o chat?')) {
                document.getElementById('chatMessages').innerHTML = '<div class="message bot-message"><div class="message-avatar bot-avatar"></div><div class="message-content"><strong>Chat limpo.</strong> Pronto para começar.</div></div>';
                conversationHistory = [];
                messageCount = 0;
            }
        }
        const API_URL = '/api/chat';
        let conversationHistory = [];
        let messageCount = 0;

        function addMessage(content, isUser = false) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${isUser ? 'user-avatar' : 'bot-avatar'}`;
            avatar.textContent = isUser ? '👤' : '✨';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            // Renderizar markdown para mensagens do bot, texto simples para usuário
            messageContent.innerHTML = isUser ? content : marked.parse(content);
            
            if (isUser) {
                messageDiv.appendChild(messageContent);
                messageDiv.appendChild(avatar);
            } else {
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(messageContent);
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            messageCount++;
            
            // Adicionar sugestões inteligentes se for mensagem do bot
            if (!isUser) {
                addSmartSuggestions(content);
            }
        }
        
        function addSmartSuggestions(botMessage) {
            const suggestions = generateSmartSuggestions(botMessage);
            
            if (suggestions.length > 0) {
                setTimeout(() => {
                    addSuggestionsButtons(suggestions);
                }, 600);
            }
        }

        function showTyping(show = true) {
            const typing = document.getElementById('typing');
            typing.style.display = show ? 'block' : 'none';
            if (show) {
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            }
        }

        function updateStats(usage) {
            const stats = document.getElementById('stats');
            if (usage) {
                stats.innerHTML = `
                    <span>Tokens: ${usage.total_tokens || 'N/A'}</span><br>
                    <span>Mensagens: ${messageCount}</span>
                `;
                stats.style.display = 'block';
                setTimeout(() => {
                    stats.style.display = 'none';
                }, 3000);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const message = input.value.trim();

            if (!message) return;

            // Adicionar mensagem do usuário
            addMessage(message, true);
            conversationHistory.push({ role: 'user', content: message });

            // Limpar input e desabilitar botão
            input.value = '';
            sendButton.disabled = true;
            showTyping(true);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message,
                        conversationHistory: conversationHistory.slice(-10)
                    }),
                });

                const data = await response.json();

                if (data.response) {
                    addMessage(data.response);
                    conversationHistory.push({ role: 'assistant', content: data.response });
                    updateStats(data.usage);
                } else {
                    addMessage('Desculpe, ocorreu um erro técnico. Por favor, tente novamente.');
                }

            } catch (error) {
                console.error('Erro:', error);
                addMessage('Erro de conexão. Verifique sua internet e tente novamente.');
            } finally {
                showTyping(false);
                sendButton.disabled = false;
                input.focus();
            }
        }

        // Sugestões inteligentes contextuais
        function generateSmartSuggestions(botMessage) {
            const msgLower = botMessage.toLowerCase();
            const suggestions = [];
            
            // Sugestões contextuais baseadas no conteúdo da resposta
            if (msgLower.includes('margens invisíveis') || msgLower.includes('livro') || msgLower.includes('ivan rocha')) {
                if (!msgLower.includes('preço') && !msgLower.includes('r$')) {
                    suggestions.push('Qual o preço?');
                }
                if (!msgLower.includes('capa dura') && !msgLower.includes('encadernação')) {
                    suggestions.push('Tem em capa dura?');
                }
                suggestions.push('Como comprar?');
            }
            
            if (msgLower.includes('preço') || msgLower.includes('r$') || msgLower.includes('capa')) {
                suggestions.push('Qual o frete?');
                suggestions.push('Comprar agora');
            }
            
            if (msgLower.includes('frete') || msgLower.includes('entrega') || msgLower.includes('recife') || msgLower.includes('brasil')) {
                suggestions.push('Formas de pagamento');
                suggestions.push('Prazo de entrega');
            }
            
            if (msgLower.includes('editora') || msgLower.includes('anglo')) {
                suggestions.push('Nossos produtos');
                suggestions.push('Quem somos?');
            }
            
            if (msgLower.includes('bispo') || msgLower.includes('reconciliação') || msgLower.includes('catedral')) {
                suggestions.push('Sobre o Bispo Ivan');
                suggestions.push('Sobre a Catedral');
            }
            
            // Se não há sugestões contextuais, usar sugestões genéricas
            if (suggestions.length === 0) {
                suggestions.push('Mais informações', 'Outras dúvidas', 'Voltar');
            }
            
            // Limitar a 3 sugestões e remover duplicatas
            const uniqueSuggestions = [...new Set(suggestions)].slice(0, 3);
            
            return uniqueSuggestions;
        }
        
        function addSuggestionsButtons(suggestions) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '💡';
            avatar.style.color = 'var(--bg-purple)';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.style.display = 'flex';
            messageContent.style.flexWrap = 'wrap';
            messageContent.style.gap = '8px';
            
            suggestions.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';
                btn.textContent = s;
                btn.onclick = () => quickMessage(s);
                messageContent.appendChild(btn);
            });
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // Sugestões iniciais
        function addInitialSuggestions() {
            const initialSuggestions = [
                "Fale sobre Margens Invisíveis",
                "Como comprar o livro?",
                "Qual o frete?"
            ];
            
            // Adicionar após 2 segundos
            setTimeout(() => {
                if (messageCount === 1) {
                    addSuggestionsButtons(initialSuggestions);
                }
            }, 2000);
        }

        function quickMessage(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }

        // Enter para enviar
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focar no input e adicionar sugestões iniciais
        document.getElementById('messageInput').focus();
        addInitialSuggestions();
    </script>
</body>
</html>
