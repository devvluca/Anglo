<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA - Editora Anglo</title>
    <link rel="icon" type="image/png" href="/img/logo_bege.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-purple: #392048;
            --text-beige: #FFCE9B;
            --text-white: #FFFFFF;
            --text-dark: #2C2C2C;
            --color-roxo: #392048;
            --color-rosa: #9d244d;
            --color-bege: #ffce9b;
            --color-azul: #67a8b2;
            --color-verde: #1d3e31;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Playfair Display', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #392048 0%, #4a2f5a 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(57, 32, 72, 0.25);
            overflow: hidden;
            height: 80vh;
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(255, 206, 155, 0.1);
        }
        
        .chat-header {
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: white;
            padding: 30px 25px;
            text-align: center;
            border-bottom: 3px solid var(--text-beige);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .chat-header-logo {
            width: 50px;
            height: auto;
            opacity: 0.95;
            transition: transform 0.3s ease;
        }
        
        .chat-header:hover .chat-header-logo {
            transform: scale(1.05);
        }
        
        .chat-header h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 600;
            color: var(--text-beige);
            letter-spacing: 0.5px;
        }
        
        .chat-header p {
            opacity: 0.9;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin: 0;
            font-weight: 300;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(to bottom, #fafafa 0%, #f5f5f5 100%);
            scroll-behavior: smooth;
        }
        
        .message {
            margin-bottom: 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideOutUp {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }
        
        .message-content {
            padding: 15px 20px;
            border-radius: 16px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.6;
            box-shadow: 0 3px 12px rgba(57, 32, 72, 0.12);
            transition: all 0.3s ease;
        }
        
        .message-content:hover {
            box-shadow: 0 4px 16px rgba(57, 32, 72, 0.15);
        }
        
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4,
        .message-content h5,
        .message-content h6 {
            margin: 12px 0 8px 0;
            font-weight: 600;
            color: var(--bg-purple);
        }
        
        .message-content h1 { font-size: 1.5em; }
        .message-content h2 { font-size: 1.3em; }
        .message-content h3 { font-size: 1.1em; }
        
        .message-content p {
            margin: 12px 0;
            line-height: 1.8;
        }
        
        .message-content ul,
        .message-content ol {
            margin: 10px 0 10px 20px;
        }
        
        .message-content li {
            margin: 5px 0;
        }
        
        .message-content code {
            background: rgba(57, 32, 72, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--bg-purple);
        }
        
        .message-content pre {
            background: rgba(57, 32, 72, 0.08);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 0.9em;
            border-left: 3px solid var(--text-beige);
        }
        
        .message-content blockquote {
            border-left: 4px solid var(--text-beige);
            padding-left: 12px;
            margin: 10px 0;
            opacity: 0.85;
            font-style: italic;
        }
        
        .message-content strong {
            font-weight: 700;
            color: var(--bg-purple);
            letter-spacing: 0.3px;
        }
        
        .message-content em {
            font-style: italic;
        }

        /* Cores da Anglo */
        .message-content roxo,
        roxo {
            color: var(--color-roxo);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .message-content rosa,
        rosa {
            color: var(--color-rosa);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .message-content bege,
        bege {
            color: var(--color-bege);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .message-content azul,
        azul {
            color: var(--color-azul);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .message-content verde,
        verde {
            color: var(--color-verde);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .message-content a {
            color: var(--bg-purple);
            text-decoration: underline;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }
        
        .message-content a:hover {
            opacity: 1;
        }
        
        .user-message .message-content code {
            background: rgba(255, 206, 155, 0.3);
            color: inherit;
        }
        
        .user-message .message-content pre {
            background: rgba(255, 206, 155, 0.2);
            border-left-color: rgba(255, 255, 255, 0.5);
        }
        
        .bot-message .message-content a {
            color: var(--bg-purple);
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .user-message .message-content {
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: white;
            margin-left: auto;
            box-shadow: 0 3px 12px rgba(57, 32, 72, 0.25);
        }
        
        .bot-message .message-content {
            background: white;
            border: 1px solid rgba(255, 206, 155, 0.2);
            color: var(--text-dark);
        }
        
        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        
        .message-avatar:hover {
            transform: scale(1.1);
        }
        
        .bot-avatar {
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: var(--text-beige);
            box-shadow: 0 3px 12px rgba(57, 32, 72, 0.2);
        }
        
        .user-avatar {
            background: linear-gradient(135deg, var(--text-beige) 0%, #e7cfa7 100%);
            color: var(--bg-purple);
            box-shadow: 0 3px 12px rgba(255, 206, 155, 0.3);
        }
        
        .typing {
            display: none;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        
        .typing-animation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .typing-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            animation: pulseGrow 1.6s infinite ease-in-out;
            box-shadow: 0 0 12px rgba(57, 32, 72, 0.3);
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes pulseGrow {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
        
        .suggestions-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        
        .suggestion-btn {
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: var(--text-beige);
            border: 2px solid var(--text-beige);
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 15px rgba(57, 32, 72, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        
        .suggestion-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
            border-radius: 25px;
        }
        
        .suggestion-btn:hover::before {
            left: 100%;
        }
        
        .suggestion-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 20px rgba(57, 32, 72, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #4a2f5a 0%, #392048 100%);
            border-color: #FFE4B5;
        }
        
        .suggestion-btn:active {
            transform: translateY(-1px) scale(0.97);
        }
        
        .chat-input {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 2px solid rgba(255, 206, 155, 0.2);
            gap: 12px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid rgba(57, 32, 72, 0.1);
            border-radius: 24px;
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
            color: var(--text-dark);
        }
        
        .chat-input input::placeholder {
            color: rgba(57, 32, 72, 0.5);
        }
        
        .chat-input input:focus {
            border-color: var(--text-beige);
            background: rgba(255, 206, 155, 0.05);
            box-shadow: 0 0 0 3px rgba(255, 206, 155, 0.1);
        }
        
        .chat-input button {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--bg-purple) 0%, #4a2f5a 100%);
            color: var(--text-beige);
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(57, 32, 72, 0.2);
        }
        
        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(57, 32, 72, 0.3);
        }
        
        .chat-input button:active {
            transform: translateY(0);
        }
        
        .chat-input button:disabled {
            background: rgba(57, 32, 72, 0.3);
            cursor: not-allowed;
            transform: none;
            color: rgba(255, 206, 155, 0.5);
        }
        
                .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(57, 32, 72, 0.9);
            color: var(--text-beige);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 12px;
            display: none;
            border: 1px solid var(--text-beige);
        }
        
        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--text-beige);
            color: var(--bg-purple);
            border: none;
            padding: 12px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(255, 206, 155, 0.3);
            z-index: 999;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(255, 206, 155, 0.4);
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .chat-container {
                height: 90vh;
                border-radius: 15px;
            }
            
            .chat-header {
                padding: 20px;
            }
            
            .chat-header h1 {
                font-size: 20px;
            }
            
            .message-content {
                max-width: 85%;
                padding: 12px 16px;
            }
            
            .chat-input {
                padding: 15px;
            }
            
            .chat-input input {
                font-size: 14px;
                padding: 12px 16px;
            }
            
            .chat-input button {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="/img/logo_bege.png" alt="Editora Anglo" class="chat-header-logo">
            <h1>Iris</h1>
            <p>IA inteligente da Editora Anglo</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-avatar bot-avatar"></div>
                <div class="message-content">
                    <strong>Olá! Bem-vindo(a)! </strong><br><br>
                    Sou a <strong>Iris</strong>, assistente inteligente da Editora Anglo. Estou aqui para conversar com você sobre nossos livros, responder dúvidas sobre produtos, fretes e tudo que você precisar saber sobre a editora.<br><br>
                    <em>Como posso ajudá-lo hoje?</em>
                </div>
            </div>
        </div>        <div class="typing" id="typing">
            <div class="typing-animation">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Digite sua mensagem sobre o livro..." maxlength="500">
            <button onclick="sendMessage()" id="sendButton"> Enviar</button>
        </div>
    </div>
    
    <div class="stats" id="stats"></div>
    
    <!-- Botão Voltar -->
    <button class="back-button" onclick="window.location.href='/'">← Voltar</button>

    <script>
        const API_URL = '/api/chat';
        let conversationHistory = [];
        let messageCount = 0;

        // Função customizada para processar markdown com suporte a links em nova aba
        function processMarkdown(content) {
            // Adicionar mais quebras de linha
            content = content.replace(/\n\n/g, '\n\n');
            content = content.replace(/([.!?])\s+([A-Z])/g, '$1\n\n$2');
            
            // Processar tags de cor ANTES do markdown (para evitar conflito)
            content = content.replace(/<roxo>#([^<]+)<\/roxo>/g, ':::ROXO:::$1:::END:::');
            content = content.replace(/<rosa>#([^<]+)<\/rosa>/g, ':::ROSA:::$1:::END:::');
            content = content.replace(/<bege>#([^<]+)<\/bege>/g, ':::BEGE:::$1:::END:::');
            content = content.replace(/<azul>#([^<]+)<\/azul>/g, ':::AZUL:::$1:::END:::');
            content = content.replace(/<verde>#([^<]+)<\/verde>/g, ':::VERDE:::$1:::END:::');
            
            // Processar com marked
            let html = marked.parse(content);
            
            // Restaurar tags de cor após markdown
            html = html.replace(/:::ROXO:::(.+?):::END:::/g, '<roxo>$1</roxo>');
            html = html.replace(/:::ROSA:::(.+?):::END:::/g, '<rosa>$1</rosa>');
            html = html.replace(/:::BEGE:::(.+?):::END:::/g, '<bege>$1</bege>');
            html = html.replace(/:::AZUL:::(.+?):::END:::/g, '<azul>$1</azul>');
            html = html.replace(/:::VERDE:::(.+?):::END:::/g, '<verde>$1</verde>');
            
            // Adicionar target="_blank" e rel a todos os links
            html = html.replace(/<a href=/g, '<a target="_blank" rel="noopener noreferrer" href=');
            
            // Melhorar styling dos links - adicionar cor roxo mais forte
            html = html.replace(/<a (target="_blank" rel="noopener noreferrer" )?href=/g, '<a style="color: #392048; font-weight: 600;" target="_blank" rel="noopener noreferrer" href=');
            
            // Aumentar espaçamento entre parágrafos
            html = html.replace(/<\/p>/g, '</p>\n');
            
            // Garantir que strong tenha cor roxa
            html = html.replace(/<strong>/g, '<strong style="color: #392048; font-weight: 700;">');
            
            return html;
        }

        function addMessage(content, isUser = false) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${isUser ? 'user-avatar' : 'bot-avatar'}`;
            avatar.textContent = isUser ? '' : '';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            // Renderizar markdown customizado para mensagens do bot, texto simples para usuário
            messageContent.innerHTML = isUser ? content : processMarkdown(content);
            
            if (isUser) {
                messageDiv.appendChild(messageContent);
                messageDiv.appendChild(avatar);
            } else {
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(messageContent);
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            messageCount++;
            
            // Adicionar sugestões inteligentes se for mensagem do bot
            if (!isUser) {
                addSmartSuggestions(content);
            }
        }
        
        
        function addSmartSuggestions(botMessage) {
            // Chamar geração de sugestões assincronamente
            generateSmartSuggestions(botMessage).then(suggestions => {
                if (suggestions.length > 0) {
                    setTimeout(() => {
                        addSuggestionsButtons(suggestions);
                    }, 300);
                }
            });
        }

        function showTyping(show = true) {
            const typing = document.getElementById('typing');
            typing.style.display = show ? 'block' : 'none';
            if (show) {
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            }
        }

        function updateStats(usage) {
            const stats = document.getElementById('stats');
            if (usage) {
                stats.innerHTML = `
                     Tokens: ${usage.total_tokens || 'N/A'}<br>
                     Mensagens: ${messageCount}<br>
                     Ativo
                `;
                stats.style.display = 'block';
                setTimeout(() => {
                    stats.style.display = 'none';
                }, 3000);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const message = input.value.trim();

            if (!message) return;

            // Adicionar mensagem do usuário
            addMessage(message, true);
            conversationHistory.push({ role: 'user', content: message });

            // Limpar input e desabilitar botão
            input.value = '';
            sendButton.disabled = true;
            showTyping(true);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message,
                        conversationHistory: conversationHistory.slice(-10)
                    }),
                });

                const data = await response.json();

                if (data.response) {
                    addMessage(data.response);
                    conversationHistory.push({ role: 'assistant', content: data.response });
                    updateStats(data.usage);
                } else {
                    addMessage(' Desculpe, ocorreu um erro técnico. Que Deus nos abençoe, tente novamente!');
                }

            } catch (error) {
                console.error('Erro:', error);
                addMessage(' Erro de conexão. Verifique sua internet e tente novamente. Deus abençoe!');
            } finally {
                showTyping(false);
                sendButton.disabled = false;
                input.focus();
            }
        }

        // Gerar sugestões inteligentes usando IA
        async function generateSmartSuggestions(botMessage) {
            try {
                // Usar endpoint dedicado para sugestões
                const response = await fetch('/api/suggestions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: botMessage,
                        // Enviar histórico completo para evitar repetição
                        conversationHistory: conversationHistory
                    }),
                });

                if (!response.ok) {
                    throw new Error('Erro ao gerar sugestões');
                }

                const data = await response.json();
                
                if (data.suggestions && Array.isArray(data.suggestions) && data.suggestions.length > 0) {
                    return data.suggestions.filter(s => s && typeof s === 'string').slice(0, 3);
                }
            } catch (error) {
                console.error('Erro ao gerar sugestões inteligentes:', error);
            }
            
            // Fallback: sugestões genéricas relacionadas à Editora Anglo
            return [
                'Quero comprar o livro',
                'Qual o valor do frete?',
                'Mais informações'
            ];
        }
        
        function addSuggestionsButtons(suggestions) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '';
            avatar.style.color = 'var(--bg-purple)';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.style.display = 'flex';
            messageContent.style.flexWrap = 'wrap';
            messageContent.style.gap = '8px';
            
            suggestions.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';
                btn.textContent = s;
                btn.onclick = () => quickMessage(s);
                messageContent.appendChild(btn);
            });
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // Sugestões iniciais - Gerar com IA
        function addInitialSuggestions() {
            const initialMessage = `Olá! Bem-vindo(a)! 

Sou a Iris, assistente inteligente da Editora Anglo. Estou aqui para conversar com você sobre nossos livros, responder dúvidas sobre produtos, fretes e tudo que você precisar saber sobre a editora.

Como posso ajudá-lo hoje?`;

            // Gerar sugestões iniciais com IA
            generateSmartSuggestions(initialMessage).then(suggestions => {
                if (suggestions.length > 0) {
                    setTimeout(() => {
                        addSuggestionsButtons(suggestions);
                    }, 1500);
                }
            });
        }

        function quickMessage(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }

        // Enter para enviar
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focar no input e adicionar sugestões iniciais
        document.getElementById('messageInput').focus();
        addInitialSuggestions();
    </script>
</body>
</html>
